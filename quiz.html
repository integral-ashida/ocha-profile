  <style>
    .record-page {
      max-width: 1040px;
      margin: 0 auto;
      padding: 0 28px 64px;
    }

    .record-head {
      padding: 56px 0 36px;
    }

    .record-head h1 {
      margin: 0 0 20px;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      line-height: 1.4;
      letter-spacing: .04em;
    }

    .record-head p {
      max-width: 42rem;
      margin: 0;
      color: var(--muted);
      line-height: 1.95;
    }

    /* 縦並びの目次 */
    .record-toc {
      margin: 0 0 56px;
    }

    .record-toc-label {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: .875rem;
      letter-spacing: .12em;
    }

    .record-toc ol {
      margin: 0;
      padding: 0;
      list-style: none;
      border-top: 1px solid var(--ink);
    }

    .record-toc li {
      border-bottom: 1px solid var(--line);
    }

    .record-toc a {
      display: grid;
      grid-template-columns: 88px minmax(0, 1fr) 24px;
      align-items: baseline;
      gap: 20px;
      padding: 20px 0;
      color: var(--ink);
      text-decoration: none;
      transition: background-color .18s ease;
    }

    .record-toc a:hover {
      background: var(--paper-deep);
    }

    .record-toc a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }

    .toc-year {
      color: var(--muted);
      font-size: .875rem;
      font-variant-numeric: tabular-nums;
    }

    .toc-title {
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.7;
    }

    /* 年号・見出し・写真 */
    .record-entry {
      display: grid;
      grid-template-columns: 88px minmax(0, 1fr);
      gap: 20px;
      padding: 36px 0 56px;
      border-top: 1px solid var(--line);
      scroll-margin-top: calc(var(--header-height, 64px) + 20px);
    }

    .record-year {
      padding-top: 7px;
      color: var(--muted);
      font-size: .875rem;
      font-variant-numeric: tabular-nums;
    }

    .record-content {
      min-width: 0;
    }

    .record-content h2 {
      margin: 0 0 24px;
      font-size: clamp(1.4rem, 3vw, 1.9rem);
      line-height: 1.6;
      letter-spacing: .02em;
    }

    .record-content .story-media {
      margin-top: 0;
      gap: 16px;
    }

    .record-back {
      display: inline-block;
      margin-top: 24px;
      padding: 8px 0;
      color: var(--muted);
      font-size: .875rem;
      text-underline-offset: 5px;
    }

    @media (max-width: 560px) {
      .record-page {
        padding: 0 16px 40px;
      }

      .record-head {
        padding: 32px 0 28px;
      }

      .record-toc {
        margin-bottom: 36px;
      }

      .record-toc a {
        grid-template-columns: 62px minmax(0, 1fr) 16px;
        gap: 12px;
        padding: 18px 0;
      }

      .record-entry {
        grid-template-columns: 1fr;
        gap: 10px;
        padding: 24px 0 36px;
      }

      .record-year {
        padding-top: 0;
      }

      .record-content h2 {
        margin-bottom: 20px;
      }
    }
  

/* Simple rectangular contents links. */
.record-toc ol{border:0;display:grid;gap:10px}
.record-toc li{border:0}
.record-toc a{display:grid;grid-template-columns:88px minmax(0,1fr);align-items:center;gap:20px;padding:20px 24px;min-height:64px;border:0;border-radius:0;background:#f1f2f2;color:var(--ink);text-decoration:none;transition:background-color .15s ease}
.record-toc .toc-title{font-size:1rem;font-weight:600;line-height:1.7;color:var(--ink);text-decoration:none}
.record-toc a:hover{background:#e3e6e6}
.record-toc a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media(max-width:560px){.record-toc a{grid-template-columns:62px minmax(0,1fr);gap:12px;padding:18px 16px}.record-toc .toc-year,.record-toc .toc-title{grid-column:auto}}


/* One shared surface for the entire contents. */
.record-toc{background:#f1f2f2;padding:24px 28px;border:0;border-radius:0}
.record-toc-label{margin-bottom:12px}
.record-toc ol{display:block;background:transparent;border:0}
.record-toc li+li{border-top:1px solid #d6dada}
.record-toc a{background:transparent;padding:18px 0;min-height:60px}
.record-toc a:hover{background:#e5e8e8}
@media(max-width:560px){.record-toc{padding:20px 16px}.record-toc a{padding:16px 0}}

</style>
