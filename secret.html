<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>ひみつの部屋｜お茶。</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/secret.css">
</head>
<body data-section="secret">
  <main class="secret-shell">
    <section id="secret-gate" class="secret-gate">
      <p class="secret-kicker">知っている人だけ、どうぞ。</p>
      <h1 tabindex="-1">ひみつの部屋</h1>
      <form id="password-form">
        <label for="secret-password">合言葉</label>
        <div class="password-row">
          <input id="secret-password" type="password" autocomplete="current-password" required>
          <button type="submit">扉を開ける</button>
        </div>
        <p id="password-error" class="password-error" aria-live="polite"></p>
      </form>
      <a class="return-link" href="index.html">← TOPへ戻る</a>
    </section>

    <section id="secret-room" class="secret-room" hidden>
      <header class="room-head">
        <div>
          <p class="secret-kicker">お茶。の個人的な展示室</p>
          <h1 tabindex="-1">ひみつの部屋</h1>
        </div>
        <button id="lock-room" class="quiet-button" type="button">扉を閉める</button>
      </header>

      <section class="room-section introduction">
        <p class="section-label">01　この部屋について</p>
        <h2>ここには、この部屋を作った理由や、見てほしい人への言葉を入れます。</h2>
        <!-- この部屋の紹介文をここに書いてください。 -->
      </section>

      <section class="room-section">
        <p class="section-label">02　いま考えていること</p>
        <h2>最近の関心、決意、忘れたくない考え</h2>
        <div class="note-grid">
          <article><time>日付を入れる</time><h3>短い見出し</h3><p>ここに本文を入れます。</p></article>
          <article><time>日付を入れる</time><h3>短い見出し</h3><p>ここに本文を入れます。</p></article>
        </div>
      </section>

      <section class="room-section" aria-labelledby="comments-title">
        <p class="section-label">03　ひとこと</p>
        <h2 id="comments-title">足あとを、ひとこと。</h2>
        <p>感想や近況など、気軽にどうぞ。</p>
        <p id="comments-status" role="status">コメント欄は準備中です。</p>
        <div id="comments" class="giscus"></div>
      </section>

      <section class="room-section closing">
        <p class="section-label">04　最後に</p>
        <blockquote>この場所の締めくくりになる、短い言葉を入れます。</blockquote>
        <a class="return-link" href="index.html">表の部屋へ戻る →</a>
      </section>
    </section>
  </main>
  <script src="js/comments-config.js"></script>
  <script src="js/secret.js"></script>
</body>
</html>
